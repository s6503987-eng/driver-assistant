<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>158 派單助理 - 一鍵整單</title>
    <!-- 引入 LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f4f4f9; 
            margin: 0; 
            padding: 15px; 
            color: #333; 
        }
        h2 { 
            text-align: center; 
            color: #1DB446; 
            margin-bottom: 20px; 
        }
        .order-card { 
            background: #fff; 
            padding: 15px; 
            margin-bottom: 12px; 
            border-radius: 10px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.08); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .order-info { 
            font-size: 14px; 
            line-height: 1.6; 
            word-break: break-all; 
            flex: 1; 
            white-space: pre-line; 
        }
        .status-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 5px;
        }
        .status-unassigned { background: #ffeaa7; color: #d35400; }
        .status-booking { background: #dfe6e9; color: #2d3436; }
        
        .btn-dispatch { 
            background: #1DB446; 
            color: white; 
            border: none; 
            padding: 10px 14px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 13px;
            height: fit-content; 
            margin-left: 12px;
            white-space: nowrap;
            box-shadow: 0 2px 4px rgba(29, 180, 70, 0.3);
        }
        .btn-dispatch:active { background: #179b38; }
        .loading { text-align: center; margin-top: 50px; color: #888; font-size: 15px; }
        .refresh-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #06c755;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>📋 158 未派單一鍵整單</h2>
    <button class="refresh-btn" onclick="fetchUnassignedOrders()">🔄 重新整理訂單</button>
    
    <div id="loading" class="loading">正在載入未派單列表...</div>
    <div id="order-container"></div>

    <script>
        const LIFF_ID = "2011777708-58qvPNLe"; // 您的 LIFF ID

        async function main() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                fetchUnassignedOrders();
            } catch (err) {
                console.error("LIFF 初始化失敗", err);
                document.getElementById('loading').innerText = "LIFF 初始化失敗，請確認設定。";
            }
        }

        async function fetchUnassignedOrders() {
            const container = document.getElementById('order-container');
            const loadingEl = document.getElementById('loading');
            loadingEl.style.display = 'block';
            container.innerHTML = '';

            try {
                // 替換為您在 n8n 建立的 Webhook Production 網址
                const response = await fetch('http://localhost:5678/webhook-test/liff-orders');
                const data = await response.json();
                
                loadingEl.style.display = 'none';

                if (!data.orders || data.orders.length === 0) {
                    container.innerHTML = `<div style="text-align:center; color:#888; margin-top:40px;">目前沒有未派單或預約等待中的訂單！</div>`;
                    return;
                }

                data.orders.forEach(order => {
                    const card = document.createElement('div');
                    card.className = 'order-card';
                    
                    const info = document.createElement('div');
                    info.className = 'order-info';
                    
                    // 根據狀態顯示不同顏色的標籤
                    let badgeClass = order.status === '預約等待中' ? 'status-booking' : 'status-unassigned';
                    
                    info.innerHTML = `
                        <span class="status-badge ${badgeClass}">[${order.status}]</span><br>
                        ${order.text}
                    `;

                    const btn = document.createElement('button');
                    btn.className = 'btn-dispatch';
                    btn.innerText = '📋 複製';
                    btn.onclick = () => {
                        navigator.clipboard.writeText(order.text);
                        // 視覺回饋
                        btn.innerText = '✅ 已複製';
                        btn.style.background = '#27ae60';
                        setTimeout(() => {
                            btn.innerText = '📋 複製';
                            btn.style.background = '#1DB446';
                        }, 1500);
                    };

                    card.appendChild(info);
                    card.appendChild(btn);
                    container.appendChild(card);
                });

            } catch (err) {
                console.error("取得未派單失敗", err);
                loadingEl.style.display = 'none';
                container.innerHTML = `<div style="text-align:center; color:#e74c3c; margin-top:40px;">無法連線至 n8n 取得訂單，請稍後再試。</div>`;
            }
        }

        main();
    </script>
</body>
</html>
